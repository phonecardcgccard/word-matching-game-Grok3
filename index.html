<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Matching Game</title>
    <link href="output.css" rel="stylesheet">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC" as="style" onload="this.rel='stylesheet'">
    <style>
        .card {
            transition: transform 0.3s ease, background-color 0.3s ease;
            user-select: none;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }
        .card.selected {
            background-color: #e0e7ff !important;
            transform: scale(1.05);
        }
        .card.matched {
            background-color: #d1fae5 !important;
            cursor: default;
        }
        .chinese-font {
            font-family: 'Noto Sans SC', sans-serif;
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
        .columns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.5rem;
        }
    </style>
</head>
<body class="bg-indigo-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-lg shadow-xl p-6 max-w-5xl w-full">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-800 mb-2">Word Match</h1>
            <p class="text-lg text-indigo-600">English-Chinese Vocabulary Game</p>
            <select id="difficulty" class="mt-2 p-2 border rounded">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <div class="flex justify-center gap-4 mt-2">
                <p class="text-sm text-indigo-400">Set: <span id="currentSet">1</span>/<span id="totalSets">30</span></p>
                <p class="text-sm text-indigo-400">Total Accuracy: <span id="totalAccuracy">0</span>%</p>
            </div>
            <div class="mt-4">
                <div class="bg-gray-200 h-2 rounded-full">
                    <div id="progressBar" class="progress-bar bg-indigo-600 h-2 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <div id="columns" class="columns-grid"></div>

        <div class="text-center mt-8">
            <button id="nextSetBtn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition-colors">Next Set</button>
            <button id="restartBtn" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg ml-4 hover:bg-gray-400 transition-colors">Restart</button>
        </div>

        <div id="message" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white p-6 rounded-lg text-center">
                <h2 id="messageTitle" class="text-2xl font-bold mb-4"></h2>
                <p id="messageText" class="mb-6"></p>
                <button id="closeModalBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Close</button>
            </div>
        </div>
    </div>

    <script>
        let wordSets = { easy: [], medium: [], hard: [] };
        let currentDifficulty = 'easy';
        let currentSetIndex = 0;
        let totalAccuracy = 0;
        let selectedEnglish = null;
        let selectedChinese = null;
        let matchedPairs = 0;
        let totalAttempts = 0;
        let isSelecting = false;
        let wordMap = {};

        async function loadWordSets(difficulty) {
            try {
                const response = await fetch(`${difficulty}.json`);
                wordSets[difficulty] = await response.json();
                if (!wordSets[difficulty].length) throw new Error('No word sets found');
                document.getElementById('totalSets').textContent = wordSets[difficulty].length;
                startGame();
            } catch (error) {
                showMessage('Error', 'Failed to load word sets. Please try again.');
                console.error(error);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let loadTimeout;
        function loadWordSet() {
            clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => {
                const words = wordSets[currentDifficulty][currentSetIndex];
                if (!words || words.length < 12) {
                    showMessage('Error', 'Invalid word set.');
                    return;
                }

                wordMap = Object.fromEntries(words.map(w => [w.english, w.chinese]));
                const shuffledEnglish = shuffleArray([...words]);
                const shuffledChinese = shuffleArray([...words]);

                const columns = document.getElementById('columns');
                columns.innerHTML = '';
                const fragment = document.createDocumentFragment();

                shuffledEnglish.forEach(word => {
                    const card = document.createElement('div');
                    card.className = 'card bg-indigo-100 rounded-lg p-2 cursor-pointer';
                    card.textContent = word.english;
                    card.dataset.english = word.english;
                    card.addEventListener('click', () => selectCard(card, 'english'));
                    fragment.appendChild(card);
                });

                shuffledChinese.forEach(word => {
                    const card = document.createElement('div');
                    card.className = 'card bg-indigo-100 rounded-lg p-2 cursor-pointer chinese-font';
                    card.textContent = word.chinese;
                    card.dataset.chinese = word.chinese;
                    card.addEventListener('click', () => selectCard(card, 'chinese'));
                    fragment.appendChild(card);
                });

                columns.appendChild(fragment);
                document.getElementById('currentSet').textContent = currentSetIndex + 1;
                document.getElementById('progressBar').style.width = `${(matchedPairs / 12) * 100}%`;
            }, 50);
        }

        function selectCard(card, type) {
            if (isSelecting || card.classList.contains('matched')) return;
            isSelecting = true;
            setTimeout(() => { isSelecting = false; }, 300);

            if (type === 'english') {
                if (selectedEnglish === card) {
                    card.classList.remove('selected');
                    selectedEnglish = null;
                } else {
                    if (selectedEnglish) selectedEnglish.classList.remove('selected');
                    card.classList.add('selected');
                    selectedEnglish = card;
                }
            } else {
                if (selectedChinese === card) {
                    card.classList.remove('selected');
                    selectedChinese = null;
                } else {
                    if (selectedChinese) selectedChinese.classList.remove('selected');
                    card.classList.add('selected');
                    selectedChinese = card;
                }
            }

            if (selectedEnglish && selectedChinese) {
                checkMatch();
            }
        }

        function checkMatch() {
            totalAttempts++;
            if (wordMap[selectedEnglish.dataset.english] === selectedChinese.dataset.chinese) {
                selectedEnglish.classList.remove('selected');
                selectedChinese.classList.remove('selected');
                selectedEnglish.classList.add('matched');
                selectedChinese.classList.add('matched');
                selectedEnglish.style.pointerEvents = 'none';
                selectedChinese.style.pointerEvents = 'none';
                matchedPairs++;
                document.getElementById('progressBar').style.width = `${(matchedPairs / 12) * 100}%`;
                if (matchedPairs === 12) {
                    const setAccuracy = (12 / totalAttempts) * 100;
                    totalAccuracy = ((totalAccuracy * currentSetIndex) + setAccuracy) / (currentSetIndex + 1);
                    document.getElementById('totalAccuracy').textContent = totalAccuracy.toFixed(2);
                    showMessage('Congratulations!', `Set completed! Accuracy: ${setAccuracy.toFixed(2)}%`);
                    saveProgress();
                }
            } else {
                selectedEnglish.classList.remove('selected');
                selectedChinese.classList.remove('selected');
                selectedEnglish.classList.add('bg-red-200');
                selectedChinese.classList.add('bg-red-200');
                setTimeout(() => {
                    selectedEnglish.classList.remove('bg-red-200');
                    selectedChinese.classList.remove('bg-red-200');
                    selectedEnglish = null;
                    selectedChinese = null;
                }, 500);
            }
            document.getElementById('totalAccuracy').textContent = totalAccuracy.toFixed(2);
        }

        function showMessage(title, text) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageText').textContent = text;
            document.getElementById('message').classList.remove('hidden');
        }

        function saveProgress() {
            localStorage.setItem('gameState', JSON.stringify({
                currentDifficulty,
                currentSetIndex,
                totalAccuracy
            }));
        }

        function loadProgress() {
            const state = JSON.parse(localStorage.getItem('gameState'));
            if (state) {
                currentDifficulty = state.currentDifficulty;
                currentSetIndex = state.currentSetIndex;
                totalAccuracy = state.totalAccuracy;
                document.getElementById('difficulty').value = currentDifficulty;
                document.getElementById('totalAccuracy').textContent = totalAccuracy.toFixed(2);
            }
        }

        function startGame() {
            matchedPairs = 0;
            totalAttempts = 0;
            selectedEnglish = null;
            selectedChinese = null;
            loadWordSet();
        }

        document.getElementById('nextSetBtn').addEventListener('click', () => {
            if (matchedPairs < 12) {
                showMessage('Incomplete', 'Please complete the current set before moving to the next.');
                return;
            }
            currentSetIndex++;
            if (currentSetIndex >= wordSets[currentDifficulty].length) {
                showMessage('Game Over', `You've completed all sets in ${currentDifficulty}! Total Accuracy: ${totalAccuracy.toFixed(2)}%`);
                currentSetIndex = 0;
                totalAccuracy = 0;
                saveProgress();
            }
            startGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            currentSetIndex = 0;
            totalAccuracy = 0;
            document.getElementById('totalAccuracy').textContent = '0';
            saveProgress();
            startGame();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('message').classList.add('hidden');
        });

        document.getElementById('difficulty').addEventListener('change', (e) => {
            currentDifficulty = e.target.value;
            currentSetIndex = 0;
            totalAccuracy = 0;
            document.getElementById('totalAccuracy').textContent = '0';
            loadWordSets(currentDifficulty);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                const cards = document.querySelectorAll('.card:not(.matched)');
                const focused = document.activeElement;
                let index = Array.from(cards).indexOf(focused);
                if (index === -1) index = 0;
                index = e.key === 'ArrowRight' ? (index + 1) % cards.length : (index - 1 + cards.length) % cards.length;
                cards[index].focus();
            } else if (e.key === 'Enter') {
                const focused = document.activeElement;
                if (focused.classList.contains('card')) {
                    const type = focused.dataset.english ? 'english' : 'chinese';
                    selectCard(focused, type);
                }
            }
        });

        window.addEventListener('resize', () => {
            loadWordSet();
        });

        loadProgress();
        loadWordSets(currentDifficulty);
    </script>
</body>
</html>
